# SpriteKiln project settings (https://github.com/LucasJRamos/spritekiln).
# Commands run anywhere inside this folder find this file.

[project]
specs = "art/specs"        # where `spritekiln new` creates specs
engine = "generic"       # godot | unity | monogame | generic
ai = ["claude"]       # assistants whose files `spritekiln update` refreshes

[export]
# `spritekiln export <spec>` (or `render --export`) copies the atlas, JSON and maps here;
# for Godot it also writes SpriteFrames, a CanvasTexture and a ready scene.
dir = "sprites"

[defaults]                # given to specs created by `spritekiln new`
view = "side"
size = 64
palette = "gothic"
camera = { pitch = 0, scale = 0.05 }
mirror = true

[style]                   # the art style every asset follows (`spritekiln style`); change it only when asked
recorded = 2026-11-22
view = "side"
height = 40               # px on screen of a human-sized character
scale = 0.05              # camera.scale of every asset (from height)
size = 64                 # frame px for that character
directions = 2
mirror = true
palette = "gothic"
colors = "cálida y terrosa; casco violeta y oro como acentos"
outline = "dark"
outline_color = "#120c0e" # with outline "dark"; empty: the darkest tone of the ramps
shading = "toon"
lines = "depth"
highlights = true
dither = "none"
light = "classic"
proportions = "chibi"
face = "minimal"          # minimal: eyes only, no nose; simple: + a hint of brow or nose on big heads; detailed
animation = "snappy"
snap = true               # root and torso move in whole pixels
references = []
notes = "Diseños propios de Socavón según el arte conceptual de Mariano: minero de casco violeta con linterna y bufanda; sereno de boina, canas y llaves. Tile de 24 px, dibujado a x2."
