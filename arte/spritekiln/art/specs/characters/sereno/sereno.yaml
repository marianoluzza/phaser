spritekiln: 1
name: sereno
extends: side_humanoid
mirror: true
size: 64
palette: [gothic, socavon]
camera: {pitch: 0, scale: 0.05, center: [0, 1.12, 0]}

brief:
  summary: sereno viejo, ancho y encorvado, dueño de las llaves
  reference: arte conceptual de Mariano (cuidador.png), perfil
  must_keep: [boina oliva con visera, patillas y bigote canosos, chaleco verde oscuro, mangas crema, llaves doradas en la cintura]
  head: "boina baja con visera, patillas y nuca canosas, cejas y bigote blancos, mandíbula cuadrada y nariz redonda"
  simplify: [botones y bolsillos desaparecen; nariz y cejas sólo como silueta, son su rasgo]

review:
  keep:
    boina: {parts: [cap, visor], min_px: 20}
    bigote: {parts: [moustache], min_px: 4}

remove: [use.sword, use.hair, parts.smear, parts.coat,
         animations.run, animations.jump, animations.rise, animations.fall, animations.land,
         animations.crouch, animations.attack, animations.hurt, animations.death]

use:
  - {kit: head, at: head, with: {width: 1.1, jaw: 0.9, chin: 0.2, nose: 0, ears: 0}}

materials:
  skin: {ramp: skin}
  cloth: {ramp: vest}
  vest: {ramp: vest}
  shirt: {ramp: shirt}
  breeches: {ramp: breeches}
  leather: {ramp: boot}
  cap: {ramp: cap}
  grey: {ramp: grey}
  gold: {ramp: gold, finish: metal}
  ink: {ramp: ink, emissive: true, band: 0, outline: false}

channels:
  nokey: 0
  lighter: 0

bones:
  torso_rot: {parent: root, pos: "[0, 0.70 + bob, 0]", rot: "[lean, twist, roll]"}
  headbase: {parent: pelvis, pos: [0, 0.56, 0.12], inherit_rot: false, inherit_scale: false, rot: "[lean*0.5, twist, roll]"}
  head: {parent: headbase, rot: "[head_pitch, head_yaw, 0]", scale: 1.85}
  shoulder_L: {parent: pelvis, pos: [0.30, 0.44, 0]}
  # El encendedor sigue al puño pero queda derecho, como se lo sostiene.
  fist_up: {parent: wrist_L, inherit_rot: false}

ik:
  arm_L: {lengths: [0.27, 0.27]}
  leg_L: {lengths: [0.34, 0.33]}

parts:
  torso:
    material: vest
    space: pelvis
    blend: 0.08
    prims:
      - ellipsoid: {c: [0, 0.16, 0.04], r: [0.27, 0.20, 0.28]}
      - ellipsoid: {c: [0, 0.38, -0.05], r: [0.28, 0.23, 0.27]}
  seat:
    material: breeches
    space: pelvis
    prims:
      - ellipsoid: {c: [0, -0.07, 0], r: [0.25, 0.15, 0.24]}
  belt:
    material: leather
    space: pelvis
    prims:
      - cylinder: {a: [0, -0.01, 0], b: [0, 0.06, 0], r: 0.27}
  neck: {material: skin, prims: [{cone: {a: [0, 0.42, 0.06], b: [0, 0.58, 0.12], r: [0.10, 0.09]}}]}
  arm_L:
    material: shirt
    blend: 0.03
    prims:
      - sphere: {c: "@shoulder_L", r: 0.13}
      - cone: {a: "@shoulder_L", b: "@elbow_L", r: [0.12, 0.10]}
  forearm_L:
    material: skin
    prims:
      - cone: {a: "@elbow_L", b: "@wrist_L", r: [0.075, 0.07]}
  hand_L:
    material: skin
    space: wrist_L
    prims:
      - sphere: {c: [0, 0, 0.03], r: 0.11}
  leg_L: {material: breeches}
  boot_L:
    material: leather
    space: sole_L
    blend: 0.03
    prims:
      - cone: {a: [0, 0.10, 0], b: [0, -0.01, 0], r: [0.095, 0.095]}
      - ellipsoid: {c: [0, -0.035, 0.07], r: [0.095, 0.07, 0.16]}
  eye_L:
    material: ink
    space: head
    priority: 3
    prims:
      - box: {c: [0.10, 0.13, 0.085], half: [0.03, 0.03, 0.022]}
  brow_L:
    material: grey
    space: head
    prims:
      - ellipsoid: {c: [0.085, 0.18, 0.11], r: [0.04, 0.025, 0.05]}
  sideburn_L:
    material: grey
    space: head
    blend: 0.02
    prims:
      - ellipsoid: {c: [0.10, 0.09, -0.02], r: [0.06, 0.11, 0.06]}
      - ellipsoid: {c: [0.06, 0.15, -0.11], r: [0.09, 0.09, 0.09]}
  big_nose:
    material: skin
    space: head
    prims:
      - ellipsoid: {c: [0, 0.105, 0.17], r: [0.05, 0.045, 0.055]}
  moustache:
    material: grey
    space: head
    prims:
      - ellipsoid: {c: [0, 0.045, 0.135], r: [0.11, 0.032, 0.05]}
  cap:
    material: cap
    space: head
    blend: 0.03
    prims:
      - ellipsoid: {c: [0, 0.255, -0.02], r: [0.17, 0.085, 0.19]}
  visor:
    material: cap
    space: head
    prims:
      - box: {c: [0, 0.222, 0.17], half: [0.11, 0.018, 0.085], round: 0.012}
  keys:
    material: gold
    space: pelvis
    when: "nokey < 0.5"
    priority: 3
    min_cover: 2
    prims:
      - torus: {c: [0.38, -0.02, -0.14], R: 0.085, r: 0.035, rot: [0, 0, 1.5708]}
      - box: {c: [0.38, -0.22, -0.17], half: [0.04, 0.12, 0.035]}
      - box: {c: [0.38, -0.28, -0.10], half: [0.04, 0.03, 0.06]}
  lighter:
    material: grey
    space: fist_up
    when: "lighter > 0.5"
    priority: 3
    prims:
      - box: {c: [0, 0.09, 0.03], half: [0.035, 0.06, 0.03], round: 0.01}

sockets:
  flame: {bone: fist_up, offset: [0, 0.22, 0.03], when: "lighter > 0.5"}

animations:
  idle:
    frames: 4
    ms: 260
    channels: &idle {lean: 0.12, bob: "0.025*sin(p)", foot_L: [0.15, 0, 0.12], foot_R: [0.15, 0, -0.10],
                     hand_L: [0.38, 0.02, 0.18], hand_R: [0.38, 0.02, 0.08]}
  idle_empty:
    frames: 4
    ms: 260
    channels: {<<: *idle, nokey: 1}
  walk:
    frames: 6
    ms: 140
    channels: &walk {lean: 0.18, bob: "-0.03 - 0.035*sin(2*p)",
                     foot_L: "[0.15, 0.10*pos(-sin(p)), 0.03 + 0.21*cos(p)]",
                     foot_R: "[0.15, 0.10*pos(sin(p)), 0.03 - 0.21*cos(p)]",
                     hand_L: "[0.38, 0.04, 0.12 - 0.16*cos(p)]", hand_R: "[0.38, 0.04, 0.12 + 0.16*cos(p)]"}
  walk_empty:
    frames: 6
    ms: 140
    channels: {<<: *walk, nokey: 1}
  run:
    frames: 6
    ms: 80
    channels: &run {lean: 0.38, head_pitch: -0.15, bob: "-0.06 - 0.05*sin(2*p)",
                    foot_L: "[0.15, 0.18*pos(-sin(p)), 0.04 + 0.30*cos(p)]",
                    foot_R: "[0.15, 0.18*pos(sin(p)), 0.04 - 0.30*cos(p)]",
                    hand_L: "[0.30, 0.36, 0.42 - 0.08*cos(p)]", hand_R: "[0.30, 0.36, 0.42 + 0.08*cos(p)]"}
  run_empty:
    frames: 6
    ms: 80
    channels: {<<: *run, nokey: 1}
  climb:
    frames: 4
    ms: 160
    channels: &climb {lean: 0.08, head_pitch: -0.12,
                      foot_L: "[0.15, 0.16 + 0.13*cos(p), 0.24]", foot_R: "[0.15, 0.16 - 0.13*cos(p), 0.24]",
                      hand_L: "[0.24, 0.62 - 0.13*cos(p), 0.36]", hand_R: "[0.24, 0.62 + 0.13*cos(p), 0.36]"}
  climb_empty:
    frames: 4
    ms: 160
    channels: {<<: *climb, nokey: 1}
  stunned:
    frames: 4
    ms: 180
    channels: &stunned {bob: -0.34, lean: "-0.15 + 0.06*sin(p)", head_pitch: "0.2 + 0.15*sin(p)",
                        foot_L: [0.15, 0, 0.42], foot_R: [0.15, 0, 0.34], pitch_foot_L: -0.8, pitch_foot_R: -0.8,
                        hand_L: [0.38, 0.0, -0.10], hand_R: [0.38, 0.0, -0.10]}
  stunned_empty:
    frames: 4
    ms: 180
    channels: {<<: *stunned, nokey: 1}
  # A oscuras lleva el encendedor en alto con la mano de adelante; el juego dibuja
  # la llama en el socket `flame`.
  idle_lit:
    frames: 4
    ms: 260
    channels: &idle_lit {<<: *idle, lighter: 1, hand_L: [0.26, 0.36, 0.38]}
  idle_lit_empty:
    frames: 4
    ms: 260
    channels: {<<: *idle_lit, nokey: 1}
  walk_lit:
    frames: 6
    ms: 140
    channels: &walk_lit {<<: *walk, lighter: 1, hand_L: [0.26, 0.36, 0.40]}
  walk_lit_empty:
    frames: 6
    ms: 140
    channels: {<<: *walk_lit, nokey: 1}
  run_lit:
    frames: 6
    ms: 80
    channels: &run_lit {<<: *run, lighter: 1, hand_L: [0.26, 0.40, 0.46]}
  run_lit_empty:
    frames: 6
    ms: 80
    channels: {<<: *run_lit, nokey: 1}
  climb_lit:
    frames: 4
    ms: 160
    channels: &climb_lit {<<: *climb, lighter: 1, hand_L: [0.24, 0.42, 0.40]}
  climb_lit_empty:
    frames: 4
    ms: 160
    channels: {<<: *climb_lit, nokey: 1}
